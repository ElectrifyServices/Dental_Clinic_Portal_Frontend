name: Compliance Evidence Gate

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: compliance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPONENT_NAME: SecurityDemo
  COMPONENT_TYPE: backend
  SYSTEM_NAME: Security Demo Platform
  DATA_CLASSIFICATION: confidential

jobs:
  compliance-scan:
    name: Compliance Scan & Gate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      # ── 1. Checkout this application repository ────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Checkout Compliance Engine (SSH Deploy Key) ─────────────────────
      - name: Setup SSH for Compliance Engine
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.COMPLIANCE_ENGINE_SSH_KEY }}

      - name: Checkout Compliance Engine
        uses: actions/checkout@v4
        with:
          repository: ElectrifyServices/security_compliance
          ssh-key: ${{ secrets.COMPLIANCE_ENGINE_SSH_KEY }}
          path: .compliance-engine
          ref: main

      # ── 3. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 4. Install Gitleaks ────────────────────────────────────────────────
      - name: Install Gitleaks
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed -E 's/.*"v?([^"]+)".*/\1/')
          VERSION=${VERSION:-8.21.2}
          echo "Installing Gitleaks v${VERSION}..."
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # ── 5. Install Semgrep ─────────────────────────────────────────────────
      - name: Install Semgrep
        run: |
          python3 -m pip install --break-system-packages semgrep || pipx install semgrep || pip install semgrep
          semgrep --version

      # ── 6. Install Trivy ───────────────────────────────────────────────────
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version

      # ── 7. Install repo dependencies (for npm audit) ───────────────────────
      - name: Install application dependencies
        run: npm ci || npm install
        continue-on-error: true

      # ── 8. Auto-generate systems config from env vars ──────────────────────
      - name: Generate systems config
        run: |
          mkdir -p .compliance
          cat > .compliance/systems.json << EOF
          {
            "catalogVersion": "1.0",
            "system": {
              "name": "${{ env.SYSTEM_NAME }}",
              "dataClassification": "${{ env.DATA_CLASSIFICATION }}",
              "certificationTargets": ["ISO-27001", "OWASP-ASVS"]
            },
            "components": [
              {
                "name": "${{ env.COMPONENT_NAME }}",
                "type": "${{ env.COMPONENT_TYPE }}",
                "path": "${{ github.workspace }}",
                "owner": "${{ github.repository_owner }}"
              }
            ]
          }
          EOF

      # ── 9. Run all security scans ──────────────────────────────────────────
      - name: Run compliance scans
        id: scan
        run: |
          mkdir -p .compliance/evidence .compliance/reports
          node .compliance-engine/src/engine/adapter-runner.js scan \
            --profile     pr-gate \
            --component   "${{ env.COMPONENT_NAME }}" \
            --system      .compliance/systems.json \
            --output      .compliance/evidence \
            --environment staging
        continue-on-error: true

      # ── 10. Evaluate controls and generate full remediation report ──────────
      - name: Generate compliance report
        id: report
        run: |
          node .compliance-engine/src/engine/adapter-runner.js report \
            --profile     pr-gate \
            --system      .compliance/systems.json \
            --evidence    .compliance/evidence \
            --environment staging \
            --out         .compliance/reports
        continue-on-error: true

      # ── 11. Parse the release decision from the JSON report ────────────────
      - name: Parse release decision
        id: decision
        run: |
          REPORT_JSON=$(ls .compliance/reports/*_compliance-report.json 2>/dev/null | tail -1)
          if [ -z "$REPORT_JSON" ]; then
            echo "release_decision=ERROR"    >> $GITHUB_OUTPUT
            echo "verified=0"               >> $GITHUB_OUTPUT
            echo "fail=0"                   >> $GITHUB_OUTPUT
            echo "partial=0"                >> $GITHUB_OUTPUT
            echo "blockers=Report generation failed — check scan step logs" >> $GITHUB_OUTPUT
          else
            DECISION=$(node -e "const r=require('./$REPORT_JSON');console.log(r.release?.releaseDecision||'UNKNOWN')")
            VERIFIED=$(node  -e "const r=require('./$REPORT_JSON');console.log(r.counts?.VERIFIED||0)")
            FAIL=$(node      -e "const r=require('./$REPORT_JSON');console.log(r.counts?.FAIL||0)")
            PARTIAL=$(node   -e "const r=require('./$REPORT_JSON');console.log(r.counts?.PARTIAL||0)")
            BLOCKERS=$(node  -e "const r=require('./$REPORT_JSON');(r.release?.blockers||[]).forEach(b=>console.log('- ❌ '+b))")
            echo "release_decision=$DECISION" >> $GITHUB_OUTPUT
            echo "verified=$VERIFIED"         >> $GITHUB_OUTPUT
            echo "fail=$FAIL"                 >> $GITHUB_OUTPUT
            echo "partial=$PARTIAL"           >> $GITHUB_OUTPUT
            {
              echo "blockers<<EOF"
              echo "$BLOCKERS"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      # ── 12. Post PR comment with gate result ───────────────────────────────
      - name: Post compliance summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const decision  = '${{ steps.decision.outputs.release_decision }}';
            const verified  = '${{ steps.decision.outputs.verified }}';
            const fail      = '${{ steps.decision.outputs.fail }}';
            const partial   = '${{ steps.decision.outputs.partial }}';
            const blockers  = `${{ steps.decision.outputs.blockers }}`;
            const component = '${{ env.COMPONENT_NAME }}';
            const system    = '${{ env.SYSTEM_NAME }}';
            const runUrl    = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const icon   = decision === 'ALLOW' ? '✅' : decision === 'BLOCK' ? '❌' : '⚠️';
            const status = decision === 'ALLOW'
              ? 'ALLOW — No critical blockers found'
              : decision === 'BLOCK'
              ? 'BLOCK — Critical/high findings must be fixed before merge'
              : 'MANUAL APPROVAL REQUIRED';

            const body = [
              `## ${icon} Compliance Gate: **${status}**`,
              `> **System:** ${system} | **Component:** \`${component}\``,
              ``,
              `| Status | Count |`,
              `| --- | --- |`,
              `| ✅ VERIFIED | ${verified} |`,
              `| ❌ FAIL | ${fail} |`,
              `| ⚠️ PARTIAL | ${partial} |`,
              ``,
              blockers ? `### Blockers preventing merge:\n${blockers}\n` : '',
              `📄 **[Download Full Report with Issue / Source / Cause / Solution](${runUrl})** → Artifacts → \`compliance-report\``,
              ``,
              `> _Generated by the Compliance Evidence Platform — evidence retained for 400 days_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Compliance Gate'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── 13. Upload evidence manifests (400 days) ───────────────────────────
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-evidence-${{ github.run_id }}
          path: .compliance/evidence/
          retention-days: 400

      # ── 14. Upload full compliance report (400 days) ───────────────────────
      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-report-${{ github.run_id }}
          path: .compliance/reports/
          retention-days: 400

      # ── 15. Fail the check to block the PR merge ───────────────────────────
      - name: Enforce gate decision
        run: |
          DECISION="${{ steps.decision.outputs.release_decision }}"
          echo "Release decision: $DECISION"
          if [ "$DECISION" = "BLOCK" ]; then
            echo ""
            echo "COMPLIANCE GATE: BLOCKED"
            echo "Critical or high severity findings exist. Fix them before merging."
            echo "Download the 'compliance-report' artifact for the full remediation playbook."
            exit 1
          elif [ "$DECISION" = "ERROR" ]; then
            echo "COMPLIANCE GATE: ERROR — report could not be generated"
            exit 1
          else
            echo "COMPLIANCE GATE: $DECISION — merge is permitted"
            exit 0
          fi
