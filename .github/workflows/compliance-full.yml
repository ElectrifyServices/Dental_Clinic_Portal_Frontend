name: Compliance Evidence Gate (Full - Weekly)

# Runs the `full-compliance` profile: adds dynamic tools (OWASP ZAP)
# on top of what the per-PR `compliance.yml` gate covers (gitleaks, semgrep, dependency, trivy).
# This is what generates DAST evidence to close AUTH-05 and SCAN-04 without disturbing
# the daily PR gate or putting repeated traffic on the AWS URL.

on:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC (Weekly off-peak scan)
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: compliance-full-${{ github.repository }}
  cancel-in-progress: false

env:
  COMPONENT_NAME: DentalClinicFrontend
  COMPONENT_TYPE: frontend
  SYSTEM_NAME: Dental Clinic Portal
  DATA_CLASSIFICATION: confidential
  NODE_VERSION: '20'

jobs:
  compliance-full-scan:
    name: Compliance Scan & Gate (Full)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout repository ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup SSH for Compliance Engine ─────────────────────────────────
      - name: Setup SSH for Compliance Engine
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.COMPLIANCE_ENGINE_SSH_KEY }}

      - name: Checkout Compliance Engine
        uses: actions/checkout@v4
        with:
          repository: ElectrifyServices/security_compliance
          ssh-key: ${{ secrets.COMPLIANCE_ENGINE_SSH_KEY }}
          path: .compliance-engine
          ref: main

      # ── 3. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── 4. Install Gitleaks ────────────────────────────────────────────────
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          echo "Installing Gitleaks v${GITLEAKS_VERSION}..."
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # ── 5. Install Semgrep ─────────────────────────────────────────────────
      - name: Install Semgrep
        run: |
          python3 -m pip install --break-system-packages semgrep || pipx install semgrep || pip install semgrep
          semgrep --version

      # ── 6. Install Trivy ───────────────────────────────────────────────────
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version

      # ── 7. Pull OWASP ZAP Docker image ────────────────────────────────────
      - name: Pull OWASP ZAP image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      # ── 8. Install application dependencies (for npm audit) ───────────────
      - name: Install application dependencies
        run: npm ci || npm install
        continue-on-error: true

      # ── 9. Auto-generate systems config from env vars ──────────────────────
      - name: Generate systems config
        run: |
          mkdir -p .compliance
          cat > .compliance/systems.json << EOF
          {
            "catalogVersion": "1.0",
            "system": {
              "name": "${{ env.SYSTEM_NAME }}",
              "dataClassification": "${{ env.DATA_CLASSIFICATION }}",
              "certificationTargets": ["ISO-27001", "OWASP-ASVS"]
            },
            "components": [
              {
                "name": "${{ env.COMPONENT_NAME }}",
                "type": "${{ env.COMPONENT_TYPE }}",
                "path": "${{ github.workspace }}",
                "owner": "${{ github.repository_owner }}"
              }
            ]
          }
          EOF

      # ── 10. Run full-compliance scans (Including OWASP ZAP) ────────────────
      - name: Run full-compliance scans
        id: scan
        run: |
          mkdir -p .compliance/evidence .compliance/reports
          node .compliance-engine/src/engine/adapter-runner.js scan \
            --profile     full-compliance \
            --component   "${{ env.COMPONENT_NAME }}" \
            --system      .compliance/systems.json \
            --output      .compliance/evidence \
            --environment staging \
            --target-url  "${{ secrets.STAGING_BASE_URL || 'https://app.opalsmiles.com/' }}"
        continue-on-error: true

      # ── 11. Evaluate controls and generate full remediation report ──────────
      - name: Generate compliance report
        id: report
        run: |
          node .compliance-engine/src/engine/adapter-runner.js report \
            --profile     full-compliance \
            --system      .compliance/systems.json \
            --evidence    .compliance/evidence \
            --environment staging \
            --out         .compliance/reports
        continue-on-error: true

      # ── 12. Upload evidence manifests (400 days) ───────────────────────────
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-full-evidence-${{ github.run_id }}
          path: .compliance/evidence/
          retention-days: 400

      # ── 13. Upload full compliance report (400 days) ───────────────────────
      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-full-report-${{ github.run_id }}
          path: .compliance/reports/
          retention-days: 400
